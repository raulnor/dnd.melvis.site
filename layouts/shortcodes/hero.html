<style>
  .toc-container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  .toc-container h1 { text-align: center; margin-bottom: 3rem; }
  .toc-grid { display: grid; grid-template-columns: 1fr; gap: 3rem; margin-bottom: 3rem; }
  @media (min-width: 768px) {
    .toc-grid { grid-template-columns: repeat(2, 1fr); gap: 4rem; }
  }
  .toc-section h2 { border-bottom: 2px solid currentColor; padding-bottom: 0.5rem; margin-bottom: 1rem; margin-top: 0; }
  .toc-links { list-style: none; padding-left: 0; margin: 0; }
  .toc-links li { margin-bottom: 0.5rem; }
  .footer-links { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid currentColor; }
  .footer-links a { margin: 0 1rem; }
</style>
<div class="toc-container">
  <h1>{{ .Site.Title }}</h1>
  <div class="toc-grid">
    <div class="toc-section">
      <h2>Heroes</h2>
      <ul class="toc-links">
{{- range sort (where .Site.RegularPages "Section" "==" "heroes") "Title" -}}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{- end -}}
      </ul>
    </div>
    <div class="toc-section">
      <h2>Items</h2>
      <ul class="toc-links">
{{- range sort (where .Site.RegularPages "Section" "==" "items") "Title" -}}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{- end -}}
      </ul>
    </div>
  </div>
  <div class="footer-links">
    <a href="/world">World</a> •
    <a href="/rules">Rules</a> •
    <a href="https://discord.gg/XwUPJVnX">Discord</a>
  </div>
</div>
